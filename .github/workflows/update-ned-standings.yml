name: Update Netherlands standings

on:
  schedule:
    - cron: '* * * * *'  # every minute — gated by game-window check below
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check if a Group F game is live
        id: check
        run: |
          python3 -c "
import datetime

# All Group F kickoffs in UTC (ISO 8601).
# 110-minute window = 90 min game + 20 min buffer for added time / delays.
KICKOFFS = [
    '2026-06-14T21:00:00',  # Matchday 1: Netherlands vs Japan  (AT&T Stadium, Arlington TX)
    '2026-06-15T03:00:00',  # Matchday 1: Sweden vs Tunisia     (Estadio Monterrey, Mexico)
    '2026-06-20T18:00:00',  # Matchday 2: Netherlands vs Sweden (NRG Stadium, Houston TX)
    '2026-06-21T03:00:00',  # Matchday 2: Tunisia vs Japan      (Estadio Monterrey, Mexico)
    '2026-06-25T23:00:00',  # Matchday 3: Japan vs Sweden       (AT&T Stadium, Arlington TX)
    '2026-06-26T00:00:00',  # Matchday 3: Tunisia vs Netherlands (Arrowhead Stadium, Kansas City)
]
WINDOW = 110 * 60  # seconds

now = datetime.datetime.utcnow()
in_window = any(
    0 <= (now - datetime.datetime.fromisoformat(k)).total_seconds() <= WINDOW
    for k in KICKOFFS
)
print('in_game=true' if in_window else 'in_game=false')
" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4
        if: steps.check.outputs.in_game == 'true'

      - name: Fetch and save Group F standings
        if: steps.check.outputs.in_game == 'true'
        run: |
          curl -sf \
            -H "X-Auth-Token: ${{ secrets.FOOTBALL_DATA_API_KEY }}" \
            "https://api.football-data.org/v4/competitions/WC/standings" \
          | python3 -c "
import json, sys
data = json.load(sys.stdin)
group = next(
  s for s in data['standings']
  if s['type'] == 'TOTAL' and any(r['team']['name'] == 'Netherlands' for r in s['table'])
)
print(json.dumps(group['table'], indent=2))
" > ned/standings.json

      - name: Commit if changed
        if: steps.check.outputs.in_game == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ned/standings.json
          git diff --staged --quiet || git commit -m "chore: update Netherlands standings"
          git push
